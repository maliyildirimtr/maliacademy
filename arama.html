<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arama Sonuçları | Mali Academy</title>
    <meta name="description" content="Mali Academy Küresel Arama Motoru. Dersler, sınav belgeleri, açık kaynak projeler, proje grupları ve akademik ilanlar arasında canlı arama yapın.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Favicon / Sekme İkonu -->
    <link rel="shortcut icon" href="assets/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
    <meta name="theme-color" content="#580018">

    <!-- Google Schema Logo Tanımlama -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Mali Academy",
      "url": "https://academy.maliyildirimtr.com",
      "logo": "https://academy.maliyildirimtr.com/assets/favicon-192x192.png"
    }
    </script>
</head>
<body data-page="arama" class="bg-[#f8fafc] text-[#0f172a] dark:bg-[#090d16] dark:text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- NAVBAR CONTAINER -->
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full space-y-8">
        
        <!-- HERO BANNER (KÜRESEL ARAMA SAYFASI) -->
        <div class="relative overflow-hidden rounded-3xl bg-slate-900/90 border border-slate-800 p-6 sm:p-8 md:p-10 shadow-2xl backdrop-blur-xl space-y-6">
            <!-- Background glows -->
            <div class="absolute -top-24 -right-24 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-tsBordo/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                <!-- SOL TARAF -->
                <div class="lg:col-span-8 space-y-5 text-left">
                    <div class="flex flex-wrap items-center gap-3">
                        <a href="index.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/80 text-xs font-bold text-slate-300 hover:text-white transition-all backdrop-blur-md shadow-sm group cursor-pointer">
                            <svg class="w-3.5 h-3.5 text-slate-400 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                            <span>Ana Sayfaya Dön</span>
                        </a>
                        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/80 text-xs font-bold text-sky-400 backdrop-blur-md shadow-sm">
                            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <span>Küresel Arama Motoru</span>
                        </div>
                    </div>

                    <h1 class="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight text-white leading-tight">
                        <span id="search-term-display" class="bg-gradient-to-r from-sky-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">...</span> İçin Arama Sonuçları
                    </h1>

                    <p class="text-xs sm:text-sm text-slate-300 max-w-2xl leading-relaxed">
                        Toplam <span id="total-matches-count" class="font-bold text-emerald-400 font-mono text-sm">0</span> adet eşleşen akademik ders, vize/final hazırlık belgesi, açık kaynak kod kütüphanesi, proje grubu ve ilan bulundu.
                    </p>
                </div>

                <!-- SAĞ TARAF: DETAYLI ARAMA INPUT BAR -->
                <div class="lg:col-span-4 w-full">
                    <form onsubmit="handleSearchPageSubmit(event)" class="relative w-full">
                        <svg class="w-4 h-4 text-slate-400 absolute left-4 top-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input id="search-page-input" type="search" name="search_page_query" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Farklı bir kelime veya konu ara..." class="w-full pl-11 pr-24 py-3 rounded-2xl bg-slate-800/90 border border-slate-700/80 text-xs text-white placeholder-slate-400 outline-none focus:border-tsMavi transition-all shadow-inner">
                        <button type="submit" class="absolute right-2 top-1.5 bottom-1.5 px-4 rounded-xl bg-gradient-to-r from-tsBordo to-tsMavi text-white font-bold text-xs shadow hover:opacity-90 transition-opacity">
                            Ara
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- FİLTRELEME SEKMLERİ (TABS) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none border-b border-slate-200 dark:border-slate-800/80">
            <button id="tab-btn-all" onclick="filterSearchTab('all')" class="px-4 py-2 rounded-xl bg-tsMavi text-white font-bold text-xs shadow-md transition-all flex items-center gap-2 cursor-pointer shrink-0">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Tüm Sonuçlar</span>
                <span id="count-all" class="px-2 py-0.5 rounded-full bg-white/20 text-[10px] font-mono font-bold">0</span>
            </button>

            <button id="tab-btn-courses" onclick="filterSearchTab('courses')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold text-xs transition-all flex items-center gap-2 cursor-pointer shrink-0">
                <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Dersler & Notlar</span>
                <span id="count-courses" class="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-[10px] font-mono font-bold">0</span>
            </button>

            <button id="tab-btn-exams" onclick="filterSearchTab('exams')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold text-xs transition-all flex items-center gap-2 cursor-pointer shrink-0">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Sınav Belgeleri</span>
                <span id="count-exams" class="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-[10px] font-mono font-bold">0</span>
            </button>

            <button id="tab-btn-openSource" onclick="filterSearchTab('openSource')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold text-xs transition-all flex items-center gap-2 cursor-pointer shrink-0">
                <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
                <span>Açık Kaynak Kitler</span>
                <span id="count-openSource" class="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-[10px] font-mono font-bold">0</span>
            </button>

            <button id="tab-btn-groups" onclick="filterSearchTab('groups')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold text-xs transition-all flex items-center gap-2 cursor-pointer shrink-0">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Proje Grupları</span>
                <span id="count-groups" class="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-[10px] font-mono font-bold">0</span>
            </button>

            <button id="tab-btn-ads" onclick="filterSearchTab('ads')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold text-xs transition-all flex items-center gap-2 cursor-pointer shrink-0">
                <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
                <span>İlanlar</span>
                <span id="count-ads" class="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-[10px] font-mono font-bold">0</span>
            </button>
        </div>

        <!-- SONUÇ KARTLARI GRID -->
        <div id="search-results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-16 text-center text-xs text-slate-400">
                Arama sonuçları yükleniyor...
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <button onclick="openSecurityModal()" title="Sistem Altyapısı ve Güvenlik Standartlarını Görüntüle" class="inline-flex items-center gap-2 hover:text-[#2563eb] dark:hover:text-sky-400 transition-colors cursor-pointer group">
            <span>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</span>
            <span class="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 group-hover:bg-blue-500/10 text-slate-600 dark:text-slate-400 group-hover:text-[#2563eb] font-mono text-[10px] border border-slate-300 dark:border-slate-700 transition-colors flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Sistem & Güvenlik Bilgisi</span>
            </span>
        </button>
    </footer>

    <!-- SCRIPT ENTEGRASYONLARI -->
    <script src="js/firebase.js?v=20260811v1"></script>
    <script src="js/sso.js?v=20260811v1"></script>
    <script src="js/main.js?v=20260811v1"></script>
    <script src="js/arama.js?v=20260811v1"></script>
</body>
</html>
