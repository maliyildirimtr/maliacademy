<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Profili | Mali Academy</title>
    <meta name="description" content="Mali Academy kullanıcı profil sayfası. Yüklenen içerikler, projeler ve katkılar.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <link rel="shortcut icon" href="assets/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
    <meta name="theme-color" content="#580018">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Mali Academy",
      "url": "https://academy.maliyildirimtr.com",
      "logo": "https://academy.maliyildirimtr.com/assets/favicon-192x192.png"
    }
    </script>

    <style>
        .profile-tab-btn { transition: all 0.2s ease; }
        .profile-tab-btn.active-tab {
            background: linear-gradient(135deg, var(--ts-bordo, #800020), var(--ts-mavi, #00a8e8));
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0,168,232,0.2);
        }
        #profile-banner-bg {
            background: linear-gradient(135deg, #0d121f 0%, #1e2a3b 50%, #0d121f 100%);
        }
        .avatar-ring { box-shadow: 0 0 0 4px #090d16, 0 0 0 6px rgba(0,168,232,0.3); }
    </style>
</head>
<body data-page="profil" class="bg-[#f8fafc] text-[#0f172a] dark:bg-[#090d16] dark:text-slate-100 min-h-screen flex flex-col antialiased">

    <div id="navbar-container"></div>

    <main class="max-w-5xl mx-auto px-4 py-10 flex-grow w-full space-y-8">

        <!-- HERO PROFILE BANNER -->
        <div id="profile-hero-section" class="relative overflow-hidden rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl bg-white dark:bg-[#0d121f]">

            <!-- KAPAK FOTOĞRAFI (BANNER) -->
            <div id="profile-banner-bg" class="h-36 sm:h-48 w-full relative">
                <!-- Background glow effects -->
                <div class="absolute -top-12 -right-12 w-64 h-64 bg-blue-500/15 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-12 -left-12 w-64 h-64 bg-tsBordo/20 rounded-full blur-3xl pointer-events-none"></div>
            </div>

            <!-- PROFİL İÇERİĞİ -->
            <div class="relative px-6 pb-6 sm:px-8 sm:pb-8">

                <!-- AVATAR + DÜZENLEMEBUTONUrow -->
                <div class="flex items-end justify-between -mt-14 sm:-mt-16 mb-4">
                    <!-- Avatar -->
                    <div class="relative">
                        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full overflow-hidden avatar-ring border-4 border-[#090d16] bg-gradient-to-br from-tsBordo to-tsMavi flex items-center justify-center" id="profile-avatar-inner">
                            <!-- Rendered by JS -->
                        </div>
                        <!-- Online dot -->
                        <span id="profile-online-dot" class="hidden absolute bottom-2 right-2 w-4 h-4 bg-emerald-500 rounded-full border-2 border-[#090d16] shadow-sm"></span>
                    </div>

                    <!-- Edit button (only for self) -->
                    <div class="flex items-center gap-2 mt-14 sm:mt-16">
                        <button id="profile-edit-btn" onclick="openEditProfileModal()" class="hidden px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 hover:text-white transition-all flex items-center gap-1.5 shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            Profili Düzenle
                        </button>
                    </div>
                </div>

                <!-- PROFİL BİLGİLERİ -->
                <div class="space-y-3">
                    <!-- Ad + Rozet -->
                    <div class="flex items-center gap-2 flex-wrap">
                        <h1 id="profile-display-name" class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white tracking-tight">...</h1>
                        <div id="profile-role-badge"></div>
                    </div>

                    <!-- Handle + Katılım tarihi -->
                    <div class="flex items-center gap-3 flex-wrap mt-0.5">
                        <span id="profile-handle" class="text-sm font-medium text-slate-500 dark:text-slate-400">@...</span>
                        <span class="text-slate-600 dark:text-slate-600 text-xs">•</span>
                        <span id="profile-join-date" class="text-xs text-slate-500 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            Yükleniyor...
                        </span>
                    </div>

                    <!-- Bio -->
                    <p id="profile-bio" class="text-sm text-slate-600 dark:text-slate-300 max-w-2xl leading-relaxed">Yükleniyor...</p>

                    <!-- Sosyal linkler + İstatistikler -->
                    <div class="flex flex-wrap items-center gap-4 pt-1">
                        <div id="profile-social-links" class="flex items-center gap-2"></div>
                        <div class="h-4 w-px bg-slate-700 hidden sm:block"></div>
                        <div id="profile-stats" class="flex items-center gap-2 flex-wrap"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB SEÇİCİ + İÇERİK ALANI -->
        <div class="space-y-6">

            <!-- TAB BUTTONS -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-thin">
                <button data-tab="all" onclick="switchProfileTab('all')" id="tab-btn-all" class="profile-tab-btn active-tab flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all border border-transparent bg-[#38bdf8] text-white shadow-md">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Tümü
                    <span id="badge-all" class="ml-1 px-1.5 py-0.5 rounded-full bg-black/20 text-[10px] font-bold">0</span>
                </button>
                <button data-tab="exams" onclick="switchProfileTab('exams')" id="tab-btn-exams" class="profile-tab-btn flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap transition-all border border-transparent bg-slate-200/50 dark:bg-white/5 hover:bg-slate-300/50 dark:hover:bg-white/10">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Ders Notları & Belgeler
                    <span id="badge-exams" class="ml-1 px-1.5 py-0.5 rounded-full bg-black/10 dark:bg-black/20 text-[10px] font-bold">0</span>
                </button>
                <button data-tab="openSource" onclick="switchProfileTab('openSource')" id="tab-btn-openSource" class="profile-tab-btn flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap transition-all border border-transparent bg-slate-200/50 dark:bg-white/5 hover:bg-slate-300/50 dark:hover:bg-white/10">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
                    Açık Kaynak Kitler
                    <span id="badge-openSource" class="ml-1 px-1.5 py-0.5 rounded-full bg-black/10 dark:bg-black/20 text-[10px] font-bold">0</span>
                </button>
                <button data-tab="groups" onclick="switchProfileTab('groups')" id="tab-btn-groups" class="profile-tab-btn flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap transition-all border border-transparent bg-slate-200/50 dark:bg-white/5 hover:bg-slate-300/50 dark:hover:bg-white/10">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Proje Grupları
                    <span id="badge-groups" class="ml-1 px-1.5 py-0.5 rounded-full bg-black/10 dark:bg-black/20 text-[10px] font-bold">0</span>
                </button>
                <button data-tab="ads" onclick="switchProfileTab('ads')" id="tab-btn-ads" class="profile-tab-btn flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap transition-all border border-transparent bg-slate-200/50 dark:bg-white/5 hover:bg-slate-300/50 dark:hover:bg-white/10">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
                    Yayınlanan İlanlar
                    <span id="badge-ads" class="ml-1 px-1.5 py-0.5 rounded-full bg-black/10 dark:bg-black/20 text-[10px] font-bold">0</span>
                </button>
                <button data-tab="pending" onclick="switchProfileTab('pending')" id="tab-btn-pending" class="hidden profile-tab-btn flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold text-amber-500 hover:text-amber-400 whitespace-nowrap transition-all border border-transparent bg-amber-500/10 hover:bg-amber-500/20">
                    <svg class="w-3.5 h-3.5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Onay Bekleyenler
                    <span id="badge-pending" class="ml-1 px-1.5 py-0.5 rounded-full bg-amber-500/20 text-[10px] font-bold">0</span>
                </button>
            </div>

            <!-- İÇERİK KARTALARI (GRID) -->
            <div id="profile-content-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Rendered by JS -->
                <div class="col-span-full flex justify-center py-12">
                    <div class="w-8 h-8 border-4 border-tsMavi border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-4 px-6 mt-8">
        <div class="max-w-5xl mx-auto flex items-center justify-between text-xs text-slate-400">
            <span>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</span>
            <a href="index.html" class="hover:text-tsMavi transition-colors flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Ana Sayfa
            </a>
        </div>
    </footer>

    <!-- =====================================================
         PROFİL DÜZENLEME MODALI
         ===================================================== -->
    <div id="edit-profile-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-lg bg-white dark:bg-[#111b21] rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">

            <!-- Modal Başlık -->
            <div class="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/20">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-tsMavi" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    <h3 class="font-bold text-base text-slate-900 dark:text-slate-100">Profili Düzenle</h3>
                </div>
                <button onclick="closeEditProfileModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Modal Form -->
            <form onsubmit="handleEditProfile(event)" class="p-5 space-y-5 overflow-y-auto max-h-[75vh]">

                <!-- Ad Soyad -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Ad Soyad</label>
                    <input id="edit-profile-displayname" type="text" placeholder="Adınızı ve soyadınızı girin" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-slate-100 outline-none focus:border-tsMavi transition-colors placeholder-slate-400">
                </div>

                <!-- Kullanıcı Adı -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Kullanıcı Adı</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium select-none">@</span>
                        <input id="edit-profile-username" type="text" placeholder="kullaniciadi" class="w-full pl-8 pr-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium text-slate-900 dark:text-slate-100 outline-none focus:border-tsMavi transition-colors placeholder-slate-400" pattern="[a-z0-9_\.]{3,20}" title="Sadece küçük harf, rakam, alt çizgi ve nokta kullanılabilir (Boşluksuz)">
                    </div>
                </div>

                <!-- Bio -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Biyografi</label>
                    <textarea id="edit-profile-bio" rows="3" placeholder="Kendinizden kısaca bahsedin..." class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-slate-100 outline-none focus:border-tsMavi transition-colors resize-none placeholder-slate-400"></textarea>
                </div>

                <!-- FOTOĞRAF YÜKLEME (2 kolon) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <!-- Profil Fotoğrafı -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">Profil Fotoğrafı</label>
                        <div class="space-y-2">
                            <div id="avatar-preview-zone" onclick="document.getElementById('input-avatar-file').click()" class="group relative w-full h-28 rounded-2xl overflow-hidden bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-tsMavi transition-all cursor-pointer flex items-center justify-center">
                                <img id="avatar-preview-img" src="" alt="" class="hidden w-full h-full object-cover">
                                <div id="avatar-upload-placeholder" class="flex flex-col items-center gap-2 text-slate-400 group-hover:text-tsMavi transition-colors select-none">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    <span class="text-[11px] font-semibold text-center leading-tight">Fotoğraf Seç<br><span class="font-normal opacity-70">JPG / PNG</span></span>
                                </div>
                                <div id="avatar-change-overlay" class="hidden absolute inset-0 bg-black/50 items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <span class="text-white text-xs font-bold">Değiştir</span>
                                </div>
                            </div>
                            <input id="input-avatar-file" type="file" accept="image/*" class="hidden" onchange="handleAvatarFileSelect(this)">
                            <button type="button" onclick="document.getElementById('input-avatar-file').click()" class="w-full py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-[11px] font-bold text-slate-600 dark:text-slate-300 transition-colors flex items-center justify-center gap-1.5">
                                <svg class="w-3.5 h-3.5 text-tsMavi" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                Fotoğraf Seç / Yükle
                            </button>
                        </div>
                    </div>

                    <!-- Kapak Fotoğrafı -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">Kapak Fotoğrafı</label>
                        <div class="space-y-2">
                            <div id="banner-preview-zone" onclick="document.getElementById('input-banner-file').click()" class="group relative w-full h-28 rounded-2xl overflow-hidden bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-tsMavi transition-all cursor-pointer flex items-center justify-center">
                                <img id="banner-preview-img" src="" alt="" class="hidden w-full h-full object-cover">
                                <div id="banner-upload-placeholder" class="flex flex-col items-center gap-2 text-slate-400 group-hover:text-tsMavi transition-colors select-none">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                    <span class="text-[11px] font-semibold text-center leading-tight">Kapak Seç<br><span class="font-normal opacity-70">JPG / PNG</span></span>
                                </div>
                                <div id="banner-change-overlay" class="hidden absolute inset-0 bg-black/50 items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <span class="text-white text-xs font-bold">Değiştir</span>
                                </div>
                            </div>
                            <input id="input-banner-file" type="file" accept="image/*" class="hidden" onchange="handleBannerFileSelect(this)">
                            <button type="button" onclick="document.getElementById('input-banner-file').click()" class="w-full py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-[11px] font-bold text-slate-600 dark:text-slate-300 transition-colors flex items-center justify-center gap-1.5">
                                <svg class="w-3.5 h-3.5 text-tsMavi" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                Kapak Seç / Yükle
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Yükleme İlerleme Çubuğu -->
                <div id="upload-progress-wrap" class="hidden space-y-1.5 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                    <div class="flex items-center justify-between text-[11px]">
                        <span id="upload-progress-label" class="text-slate-600 dark:text-slate-300 font-semibold">Yükleniyor...</span>
                        <span id="upload-progress-pct" class="text-tsMavi font-bold">0%</span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                        <div id="upload-progress-bar" class="h-full bg-gradient-to-r from-tsBordo to-tsMavi rounded-full transition-all duration-300" style="width:0%"></div>
                    </div>
                </div>

                <!-- DİNAMİK SOSYAL BAĞLANTILAR -->
                <div class="space-y-3 pt-1">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Sosyal Bağlantılar</label>
                        <button type="button" onclick="addSocialLinkRow()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-tsMavi/10 hover:bg-tsMavi/20 border border-tsMavi/20 text-tsMavi text-[11px] font-bold transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Bağlantı Ekle
                        </button>
                    </div>
                    <div id="social-links-container" class="space-y-2"></div>
                    <p id="social-links-empty" class="text-[11px] text-slate-400 italic py-1">Henüz bağlantı eklenmedi. Yukarıdaki "+ Bağlantı Ekle" butonuna tıklayın.</p>
                </div>

                <!-- Submit -->
                <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeEditProfileModal()" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">İptal</button>
                    <button id="btn-save-profile" type="submit" class="px-6 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-tsBordo to-tsMavi text-white shadow-md hover:opacity-90 transition-opacity flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Kaydet
                    </button>
                </div>
            </form>

        </div>
    </div>
