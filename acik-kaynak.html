<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açık Kaynak Kit & Kod Deposu | Mali Academy</title>
    <meta name="description" content="Mali Academy Açık Kaynak Mühendislik Kitleri, SystemVerilog/FPGA mimarileri, STM32 FreeRTOS repoları ve açık kaynak donanım projeleri.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

        <!-- Favicon / Sekme İkonu (Cache-Busting dahil) -->
    <link rel="shortcut icon" href="assets/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
    <meta name="theme-color" content="#580018">

    <!-- Google Schema Logo Tanımlama -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Mali Academy",
      "url": "https://academy.maliyildirimtr.com",
      "logo": "https://academy.maliyildirimtr.com/assets/favicon-192x192.png"
    }
    </script>
</head>
<body data-page="acik-kaynak" class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-10 flex-grow w-full space-y-8">
        
        <!-- HEADER SECTION -->
        <div class="p-8 rounded-3xl border border-slate-200 dark:border-slate-800 bg-gradient-to-br from-white via-slate-50 to-slate-100 dark:from-slate-900/90 dark:via-slate-900/60 dark:to-slate-950 shadow-xl relative overflow-hidden space-y-4">
            <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-tsBordo via-rose-500 to-tsMavi"></div>
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="space-y-2 max-w-2xl">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20 text-xs font-bold w-fit">
                        <span>📦</span> Açık Kaynak Mühendislik
                    </div>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Açık Kaynak Donanım & Yazılım Kitleri</h1>
                    <p class="text-xs md:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                        Mühendislik öğrencileri ve geliştiriciler için hazırladığımız hazır kod şablonları, FPGA/SystemVerilog kütüphaneleri ve gömülü sistem projelendirme kitleri.
                    </p>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openAddResourceModal()" class="px-5 py-2.5 rounded-xl bg-tsMavi text-white font-bold text-xs hover:bg-blue-600 transition-colors inline-flex items-center gap-2 shadow-sm">
                        <span>＋</span> Kaynak Ekle
                    </button>
                </div>
            </div>
        </div>

        <!-- KİT KARTLARI GRİDİ -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="kit-cards-grid">
            <!-- Dynamically populated via js/acik-kaynak.js -->
        </div>

    </main>

    <!-- KAYNAK EKLE MODAL -->
    <div id="add-resource-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeAddResourceModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
            <div class="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-md shadow-2xl overflow-hidden pointer-events-auto border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh]">
                <div class="p-5 flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-800/20">
                    <h3 class="font-bold text-base text-slate-900 dark:text-slate-100 flex items-center gap-2">
                        <span>📦</span> Yeni Kaynak Ekle
                    </h3>
                    <button onclick="closeAddResourceModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="p-5 overflow-y-auto">
                    <form id="add-resource-form" onsubmit="handleAddResource(event)" class="space-y-4">
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Proje / Kaynak Adı</label>
                            <input type="text" id="res-title" required placeholder="Örn: Açık Kaynak Görüntü İşleme" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:border-tsMavi transition-colors">
                        </div>
                        
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Kategori</label>
                            <select id="res-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:border-tsMavi transition-colors appearance-none">
                                <option value="Yazılım">Yazılım</option>
                                <option value="Donanım">Donanım / FPGA</option>
                                <option value="Yapay Zeka">Yapay Zeka / ML</option>
                                <option value="Gömülü Sistemler">Gömülü Sistemler</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>

                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Yükleme Türü</label>
                            <select id="res-upload-type" onchange="toggleResourceUploadType()" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:border-tsMavi transition-colors appearance-none">
                                <option value="file">Dosya Yükle (< 15MB, PDF/Resim/ZIP)</option>
                                <option value="link">Harici Repo / Drive Linki (> 15MB)</option>
                            </select>
                        </div>
                        
                        <div id="res-file-container" class="space-y-1.5">
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Dosya Seç (Max 15 MB)</label>
                            <input type="file" id="res-file" accept=".pdf,image/png,image/jpeg,.zip,.rar,.tar.gz" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-tsMavi/10 file:text-tsMavi hover:file:bg-tsMavi/20 transition-colors">
                        </div>

                        <div id="res-link-container" class="space-y-1.5 hidden">
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Proje / Bağlantı Linki (URL)</label>
                            <input type="url" id="res-link" placeholder="GitHub, Drive veya diğer bağlantı" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:border-tsMavi transition-colors">
                        </div>
                        
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Açıklama</label>
                            <textarea id="res-description" required rows="3" placeholder="Projeniz ne işe yarıyor?" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:border-tsMavi transition-colors resize-none"></textarea>
                        </div>

                        <!-- İlerleme Çubuğu -->
                        <div id="res-upload-progress-container" class="hidden space-y-1">
                            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5">
                                <div id="res-upload-progress-bar" class="bg-tsMavi h-2.5 rounded-full" style="width: 0%"></div>
                            </div>
                            <p id="res-upload-progress-text" class="text-[10px] text-slate-500 text-right">0%</p>
                        </div>

                        <!-- Yasal Sorumluluk Onayı -->
                        <div class="space-y-1.5 pt-2">
                            <label class="flex items-start gap-2 cursor-pointer">
                                <input type="checkbox" id="res-legal-consent" required class="mt-0.5 rounded border-slate-300 text-tsMavi focus:ring-tsMavi">
                                <span class="text-[10px] text-slate-600 dark:text-slate-400 leading-tight">
                                    Yüklediğim belgenin/kaynağın telif haklarına uygun olduğunu, tüm yasal ve idari sorumluluğun tarafıma ait olduğunu kabul ediyorum.
                                </span>
                            </label>
                        </div>
                        
                        <div class="pt-4 flex gap-3">
                            <button type="button" onclick="closeAddResourceModal()" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold text-sm hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">İptal</button>
                            <button type="submit" id="btn-add-resource" class="flex-1 px-4 py-2.5 rounded-xl bg-tsMavi text-white font-bold text-sm hover:bg-blue-600 transition-colors shadow-md">Kaynağı Ekle</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/firebase.js?v=3"></script>
    <script src="js/sso.js"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/acik-kaynak-v2.js?v=4"></script>
</body>
</html>
