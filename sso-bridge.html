<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mali Network SSO Bridge</title>

        <!-- Favicon / Sekme İkonu (Cache-Busting dahil) -->
    <link rel="shortcut icon" href="assets/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
    <meta name="theme-color" content="#580018">

    <!-- Google Schema Logo Tanımlama -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Mali Academy",
      "url": "https://academy.maliyildirimtr.com",
      "logo": "https://academy.maliyildirimtr.com/assets/favicon-192x192.png"
    }
    </script>
</head>
<body>
    <script>
        const STORAGE_KEY = '_mali_sso_user';
        window.addEventListener('message', function(event) {
            if (!event.data || !event.data.type) return;

            if (event.data.type === 'SYNC_SSO' && event.data.data) {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(event.data.data)); } catch(e) {}
            } else if (event.data.type === 'CLEAR_SSO') {
                try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
            } else if (event.data.type === 'GET_SSO') {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    event.source.postMessage({
                        type: 'SSO_BRIDGE_RESPONSE',
                        data: data ? JSON.parse(data) : null
                    }, event.origin);
                } catch(e) {}
            }
        });
        
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data && window.parent) {
                window.parent.postMessage({
                    type: 'SSO_BRIDGE_RESPONSE',
                    data: JSON.parse(data)
                }, '*');
            }
        } catch(e) {}
    </script>
</body>
</html>
